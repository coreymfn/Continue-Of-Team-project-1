<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Team</title>
</head>
<body>
    <h1>{{ team_name }} Team</h1>
    <p>The Documentation Team is responsible for managing the community's social media by sharing updates, 
        posting content, and keeping everyone informed about community activities.</p>
    <h2>Team Members</h2>

    <ul>
        {% for member in members %}
            <li>{{ member }}</li>
        {% endfor %}
    </ul>
</body>
</html>
