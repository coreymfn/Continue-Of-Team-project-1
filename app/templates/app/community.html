<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Team</title>
</head>
<body>
    <h1>{{ team_name }} Team</h1>
    <p>The Community Team is responsible for organizing community days and planning activities to keep everyone 
        engaged, entertained, and involved.</p>
    <h2>Team Members</h2>

    <ul>
        {% for member in members %}
            <li>{{ member }}</li>
        {% endfor %}
    </ul>
</body>
</html>
