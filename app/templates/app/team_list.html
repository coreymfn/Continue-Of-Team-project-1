{% extends 'app/base.html' %}

{% block content %}
    <h1>BCCA Leadership Project Teams</h1>

    <ul>
        {% for team_key, team in teams.items %}
            <li>
                <a href="{% url 'team_detail' team_key %}">
                    {{ team.name }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
